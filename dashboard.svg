      <stop offset="0" stop-color="#070713"/><stop offset="1" stop-color="#0d0d22"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#19e3ff"/>
