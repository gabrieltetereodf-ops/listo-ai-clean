  <text x="40" y="690" fill="#7c5cff" font-size="13" font-weight="700">Status: MVP ao vivo ✓ · auth ✓ · freemium ✓ · checkout(teste) ✓ · scheduler ✓ · pronto p/ deploy Cloudflare R$0</text>
